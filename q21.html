<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <!-- cdn bootstrap -->
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="main">
        <div class="heading1">
            <h1>Advance Calculator</h1>

        </div>
        <h2 class="results" id="result">0</h2>
        <h2 class="results" id="total"></h2>
        <div class="buttons">
            <div class="row">
                <div class="col-md-3">
                    <button class="btns" id="btn1">7</button>
                    <button class="btns" id="btn2">8</button>
                    <button class="btns" id="btn3">9</button>
                    <button class="btns" id="btn4">-</button>
                </div>
                <div class="col-md-3">
                    <button class="btns" id="btn5">4</button>
                    <button class="btns" id="btn6">5</button>
                    <button class="btns" id="btn7">6</button>
                    <button class="btns" id="btn8">/</button>
                </div>
                <div class="col-md-3">
                    <button class="btns" id="btn9">1</button>
                    <button class="btns" id="btn10">2</button>
                    <button class="btns" id="btn11">3</button>
                    <button class="btns" id="btn12">*</button>
                </div>
                <div class="col-md-3">
                    <button class="btns" id="btn13">c</button>
                    <button class="btns" id="btn14">0</button>
                    <button class="btns" id="btn15">=</button>
                    <button class="btns" id="btn16">+</button>
                </div>
            </div>




        </div>
    </div>





    <script>
        let result = document.getElementById("result");
        let total = document.getElementById("total");

        let btn1 = document.getElementById("btn1");
        let btn2 = document.getElementById("btn2");
        let btn3 = document.getElementById("btn3");
        let btn4 = document.getElementById("btn4");
        let btn5 = document.getElementById("btn5");
        let btn6 = document.getElementById("btn6");
        let btn7 = document.getElementById("btn7");
        let btn8 = document.getElementById("btn8");
        let btn9 = document.getElementById("btn9");
        let btn10 = document.getElementById("btn10");
        let btn11 = document.getElementById("btn11");
        let btn12 = document.getElementById("btn12");
        let btn13 = document.getElementById("btn13");
        let btn14 = document.getElementById("btn14");
        let btn15 = document.getElementById("btn15");
        let btn16 = document.getElementById("btn16");

        let res = "0";
        let operation = "";

        // 7
        btn1.addEventListener("click", function () {
            res = result.innerText;
            if (res === "0") {
                result.innerText = "7";
            } else {
                result.innerText = res + "7";
            }
        });

        // 8
        btn2.addEventListener("click", function () {
            res = result.innerText;
            if (res === "0") {
                result.innerText = "8";
            } else {
                result.innerText = res + "8";
            }
        });

        // 9
        btn3.addEventListener("click", function () {
            res = result.innerText;
            if (res === "0") {
                result.innerText = "9";
            } else {
                result.innerText = res + "9";
            }
        });

        // 4
        btn5.addEventListener("click", function () {
            res = result.innerText;
            if (res === "0") {
                result.innerText = "4";
            } else {
                result.innerText = res + "4";
            }
        });

        // 5
        btn6.addEventListener("click", function () {
            res = result.innerText;
            if (res === "0") {
                result.innerText = "5";
            } else {
                result.innerText = res + "5";
            }
        });

        // 6
        btn7.addEventListener("click", function () {
            res = result.innerText;
            if (res === "0") {
                result.innerText = "6";
            } else {
                result.innerText = res + "6";
            }
        });

        // 1
        btn9.addEventListener("click", function () {
            res = result.innerText;
            if (res === "0") {
                result.innerText = "1";
            } else {
                result.innerText = res + "1";
            }
        });

        // 2
        btn10.addEventListener("click", function () {
            res = result.innerText;
            if (res === "0") {
                result.innerText = "2";
            } else {
                result.innerText = res + "2";
            }
        });

        // 3
        btn11.addEventListener("click", function () {
            res = result.innerText;
            if (res === "0") {
                result.innerText = "3";
            } else {
                result.innerText = res + "3";
            }
        });

        // 0
        btn14.addEventListener("click", function () {
            res = result.innerText;
            if (res === "0") {
                result.innerText = "0";
            } else {
                result.innerText = res + "0";
            }
        });


        // OPERATORS

        // -
        btn4.addEventListener("click", function () {
            operation = "-";
            result.innerText = result.innerText + "-";
        });

        // /
        btn8.addEventListener("click", function () {
            operation = "/";
            result.innerText = result.innerText + "/";
        });

        // *
        btn12.addEventListener("click", function () {
            operation = "*";
            result.innerText = result.innerText + "*";
        });

        // +
        btn16.addEventListener("click", function () {
            operation = "+";
            result.innerText = result.innerText + "+";
        });


        // CLEAR 

        btn13.addEventListener("click", function () {
            result.innerText = "0";
            total.innerText = "";
            operation = "";
        });


        //EQUAl

        btn15.addEventListener("click", function () {

            let expression = result.innerText;

            try {
                let answer = eval(expression);

                total.innerText = "=" + answer;

            } catch (error) {
                total.innerText = "Invalid";
            }

        });

    </script>
</body>

</html>
